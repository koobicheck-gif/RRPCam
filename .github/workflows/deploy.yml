name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/build-rrp-field-docs-CQggQ
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove server-only routes for static export
        # API routes and middleware require a Node.js server; they cannot be
        # included in a static export. The demo build uses mock data instead.
        run: |
          rm -rf src/app/api
          rm -f src/middleware.ts

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_DEMO_MODE: "true"
          NEXTAUTH_SECRET: "demo-secret-static-build-only"
          NEXTAUTH_URL: "https://${{ github.repository_owner }}.github.io/RRPCam"

      - name: Add .nojekyll
        # Prevents GitHub Pages from ignoring _next/ folder (starts with underscore)
        run: touch out/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
